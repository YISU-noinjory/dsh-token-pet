# electron-builder 配置
#
# 用法：
#   npm run dist       # 打包成安装包（release/ 目录）
#   npm run dist:win   # 明确只打 Windows
#   npm run pack       # 只生成未压缩的目录，用于快速验证打包结果
#
# 首次打包前必须先 `npm run build`——dist/ 是构建产物且被 .gitignore 排除，
# scripts 里的 dist 命令已经串好了这一步。

appId: com.dshtokenpet.app
productName: DSH Token Pet

directories:
  output: release
  buildResources: build

# 只把运行时真正需要的东西塞进去。
# 注意：src/ 不进包——包里跑的是 tsc 编译出的 dist/。
files:
  - dist/**/*
  - package.json
  - cordis.patch.yml
  - '!**/*.map'
  - '!**/*.ts'
  - '!src/**/*'
  - '!scripts/**/*'

# 打进 asar 归档：既减少小文件数量，也避免用户误改内部资源。
# 代价是 app.getAppPath() 指向归档内部、不可写，所以运行时配置要读
# 可执行文件旁边的 pet.config.json（见 src/main/index.ts 的 readRawConfig）。
asar: true

win:
  target:
    - target: nsis
      arch:
        - x64
  # 自定义图标放到 build/icon.ico（256×256）。
  # 没有这个文件时 electron-builder 会退回默认的 Electron 图标并给出警告，
  # 不影响打包成功。
  artifactName: ${productName}-${version}-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: DSH Token Pet
  # 卸载时保留 %APPDATA% 下的用户数据（宠物图片、设置、日志）。
  deleteAppDataOnUninstall: false
